<svg xmlns="http://www.w3.org/2000/svg" width="958" height="920" viewBox="0 0 958 920" role="img" aria-label="pgtop terminal report">
<rect width="958" height="920" rx="10" fill="#0d1117"/>
<rect width="958" height="30" rx="10" fill="#161b22"/>
<rect y="29" width="958" height="1" fill="#30363d"/>
<circle cx="24" cy="15" r="6" fill="#ff5f56"/>
<circle cx="42" cy="15" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="15" r="6" fill="#27c93f"/>
<text x="479" y="19" text-anchor="middle" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">pgtop — PostgreSQL workload advisor</text>
<text x="22" y="64" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">pgtop 0.1.0</tspan><tspan fill="#c9d1d9">  ·  database pgtop  ·  PostgreSQL 17.12  ·  snapshot 2026-11-14T11:35:36.597293861Z</tspan></text>
<text x="22" y="82" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">────────────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="22" y="100" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">4 low, 1 high, 1 critical (showing 2)</tspan></text>
<text x="22" y="118" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"></text>
<text x="22" y="136" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">1</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72" font-weight="600">CRITICAL</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">Sequential scans dominate reads on public.orders</tspan></text>
<text x="22" y="154" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      </tspan><tspan fill="#7d8590">rule missing-index · public.orders</tspan></text>
<text x="22" y="172" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"></text>
<text x="22" y="190" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      3.6K sequential scans against 1 index scans over 1.0M live rows. Each scan walks the table (60.1 MiB),</tspan></text>
<text x="22" y="208" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      so roughly 362.5 GiB of reads are full-table work an index path could avoid.</tspan></text>
<text x="22" y="226" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"></text>
<text x="22" y="244" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      evidence</tspan></text>
<text x="22" y="262" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        sequential scans           3.6K</tspan></text>
<text x="22" y="280" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        index scans                1</tspan></text>
<text x="22" y="298" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        sequential scan share      100.0%</tspan></text>
<text x="22" y="316" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        live rows                  1.0M</tspan></text>
<text x="22" y="334" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        table size                 103.1 MiB</tspan></text>
<text x="22" y="352" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        rows walked by scans       3.6B</tspan></text>
<text x="22" y="370" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        inferred filter column     status</tspan></text>
<text x="22" y="388" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"></text>
<text x="22" y="406" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      </tspan><tspan fill="#c9d1d9" font-weight="600">fix</tspan><tspan fill="#c9d1d9">  Index public.orders on (status); it leads the filters of 1.2K calls seen in pg_stat_statements.</tspan></text>
<text x="22" y="424" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        </tspan><tspan fill="#7d8590">CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_orders_status ON public.orders (status);</tspan></text>
<text x="22" y="442" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#c9d1d9"> CONCURRENTLY cannot run inside a transaction block and briefly doubles index write cost.</tspan></text>
<text x="22" y="460" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#c9d1d9"> The column was inferred from query text; confirm it with EXPLAIN (ANALYZE, BUFFERS).</tspan></text>
<text x="22" y="478" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#c9d1d9"> Re-run pgtop after the index is live to see whether the sequential scan share drops.</tspan></text>
<text x="22" y="496" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"></text>
<text x="22" y="514" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">2</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">HIGH    </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">Vacuum debt on public.events</tspan></text>
<text x="22" y="532" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      </tspan><tspan fill="#7d8590">rule vacuum-debt · public.events</tspan></text>
<text x="22" y="550" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"></text>
<text x="22" y="568" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      50.0K dead tuples (25.0% of the table) are still referenced by the visibility map, wasting about 43.4</tspan></text>
<text x="22" y="586" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      MiB and forcing every scan to step over them. Autovacuum has not brought this down to the configured</tspan></text>
<text x="22" y="604" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      thresholds.</tspan></text>
<text x="22" y="622" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"></text>
<text x="22" y="640" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      evidence</tspan></text>
<text x="22" y="658" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        dead tuples                50.0K</tspan></text>
<text x="22" y="676" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        live tuples                150.0K</tspan></text>
<text x="22" y="694" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        dead tuple ratio           25.0%</tspan></text>
<text x="22" y="712" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        estimated dead bytes       43.4 MiB</tspan></text>
<text x="22" y="730" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        modifications since analyze 0</tspan></text>
<text x="22" y="748" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        last vacuum                never</tspan></text>
<text x="22" y="766" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        last analyze               2026-11-14T11:35:33.707564Z</tspan></text>
<text x="22" y="784" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"></text>
<text x="22" y="802" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">      </tspan><tspan fill="#c9d1d9" font-weight="600">fix</tspan><tspan fill="#c9d1d9">  Vacuum public.events now, and lower its autovacuum thresholds so it keeps up.</tspan></text>
<text x="22" y="820" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        </tspan><tspan fill="#7d8590">VACUUM (ANALYZE, VERBOSE) public.events;</tspan></text>
<text x="22" y="838" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        </tspan><tspan fill="#7d8590">ALTER TABLE public.events SET (autovacuum_vacuum_scale_factor = 0.02, autovacuum_vacuum_threshold = 100);</tspan></text>
<text x="22" y="856" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#c9d1d9"> Plain VACUUM reclaims space for reuse but does not return it to the operating system.</tspan></text>
<text x="22" y="874" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#c9d1d9"> VACUUM FULL rewrites the table under an ACCESS EXCLUSIVE lock; use pg_repack if you need the space back online.</tspan></text>
<text x="22" y="892" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c9d1d9"><tspan fill="#c9d1d9">        </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#c9d1d9"> Check for long-running transactions or abandoned replication slots holding back the xmin horizon first.</tspan></text>
</svg>
