name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scalafmt and scalafix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Mill and coursier downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
          key: lint-${{ runner.os }}-${{ hashFiles('build.mill', 'flake.lock', '.scalafmt.conf', '.scalafix.conf') }}
          restore-keys: |
            lint-${{ runner.os }}-

      - name: Formatting and linting
        run: nix develop -c mill --no-server lint.check
